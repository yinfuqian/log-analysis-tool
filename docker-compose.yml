# 故障分析工具完整服务栈。外部 MySQL/Redis 可通过 COMPOSE_MYSQL_HOST 和 COMPOSE_REDIS_HOST 覆盖。
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.10-slim-bookworm}
    NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20-bookworm-slim}
    CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.142.5}
    NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    APT_MIRROR: ${APT_MIRROR:-https://mirrors.aliyun.com/debian}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}

x-backend-environment: &backend-environment
  PYTHONUNBUFFERED: "1"
  FLASK_APP: app.py
  AUTH_USERS_FILE: /data/users.csv
  MYSQL_HOST: ${COMPOSE_MYSQL_HOST:-mysql}
  MYSQL_PORT: ${COMPOSE_MYSQL_PORT:-3306}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-log_analyzer}
  MYSQL_USERNAME: ${MYSQL_USERNAME:-log_analyzer}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
  REDIS_HOST: ${COMPOSE_REDIS_HOST:-redis}
  REDIS_PORT: ${COMPOSE_REDIS_PORT:-6379}
  REDIS_DATABASE: ${REDIS_DATABASE:-0}
  REDIS_USERNAME: ${REDIS_USERNAME:-default}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
  PADDLE_PDX_CACHE_HOME: /data/paddle-cache
  REPO_CACHE_DIR: /tmp/fault-analyzer-repos
  # 技能执行（Codex Agent）相关配置。CODEX_BASE_URL/CODEX_API_KEY 为空时回退到 OPENAI_URL/OPENAI_KEY。
  # 技能目录与 CODEX_HOME 分离：技能由宿主机 ./skills 只读挂载，CODEX_HOME 用独立卷存放运行期状态。
  SKILLS_DIR: ${SKILLS_DIR:-/data/skills}
  SKILL_WORKSPACE_DIR: /data/skill-workspace
  CODEX_HOME: /data/codex
  # 外部调用令牌：默认值仅用于本地验证，生产环境请在 .env 中替换为随机强令牌。
  SKILL_API_TOKEN: ${SKILL_API_TOKEN:-local-dev-token}
  SKILL_URL_ALLOWED_HOSTS: ${SKILL_URL_ALLOWED_HOSTS:-jira.in.wezhuiyi.com}
  CODEX_BIN: ${CODEX_BIN:-codex}
  CODEX_MODEL: ${CODEX_MODEL:-codex/deepseek-flash}
  CODEX_MODEL_PROVIDER: ${CODEX_MODEL_PROVIDER:-skillrun}
  CODEX_BASE_URL: ${CODEX_BASE_URL:-https://newapi.in.wezhuiyi.com/v1}
  CODEX_API_KEY: ${CODEX_API_KEY:-}
  CODEX_API_KEY_ENV: ${CODEX_API_KEY_ENV:-CODEX_SKILL_API_KEY}
  CODEX_WIRE_API: ${CODEX_WIRE_API:-responses}
  CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-high}
  CODEX_SANDBOX: ${CODEX_SANDBOX:-danger-full-access}
  CODEX_EPHEMERAL: ${CODEX_EPHEMERAL:-true}
  CODEX_SKILL_TIMEOUT: ${CODEX_SKILL_TIMEOUT:-1800}
  # 连续网络错误达到该次数即判定模型/Jira 不可达并提前终止，避免空转到超时。
  CODEX_NETWORK_RETRY_LIMIT: ${CODEX_NETWORK_RETRY_LIMIT:-10}
  # worker 启动时把上一次运行遗留的“执行中”任务标记为失败。
  SKILL_RECOVER_ORPHANS: ${SKILL_RECOVER_ORPHANS:-true}
  JIRA_TOKEN: ${JIRA_TOKEN:-}
  JIRA_BASE_URL: ${JIRA_BASE_URL:-https://jira.in.wezhuiyi.com}

x-backend-volumes: &backend-volumes
  - uploads:/data/upload
  - ./config:/data/
  # 技能目录只读挂载：Codex 运行时无法改动技能定义，也不会把内置技能写进业务技能目录。
  - ./skills:/data/skills:ro
  # CODEX_HOME 独立命名卷：Codex 状态库（state/logs/goals 等）落在卷内，不污染仓库目录。
  - codex-home:/data/codex
  - skill-workspace:/data/skill-workspace
  - runtime-logs:/app/app/logs
  - repo-cache:/tmp/fault-analyzer-repos
  - ocr-models:/data/paddle-cache

services:
  mysql:
    profiles: ["local-deps"]
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-log_analyzer}
      MYSQL_USER: ${MYSQL_USERNAME:-log_analyzer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    profiles: ["local-deps"]
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7.4-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: ${BACKEND_IMAGE:-fault-analysis-backend:latest}
    build: *backend-build
    env_file:
      - .env
    environment: *backend-environment
    command: ["sh", "-c", "python init_database.py && flask db upgrade"]
    volumes: *backend-volumes
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    restart: "no"

  api:
    image: ${BACKEND_IMAGE:-fault-analysis-backend:latest}
    build: *backend-build
    env_file:
      - .env
    environment: *backend-environment
    command:
      - gunicorn
      - -w
      - ${WEB_CONCURRENCY:-4}
      - -k
      - ${GUNICORN_WORKER_CLASS:-gthread}
      - --threads
      - ${WEB_THREADS:-8}
      - --timeout
      - ${GUNICORN_TIMEOUT:-300}
      - --bind
      - 0.0.0.0:5000
      - app:create_app()
    ports:
      - "${API_PORT:-5000}:5000"
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "verify_runtime.py", "--runtime"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  worker:
    image: ${BACKEND_IMAGE:-fault-analysis-backend:latest}
    build: *backend-build
    env_file:
      - .env
    environment: *backend-environment
    command:
      - celery
      - -A
      - celery_worker.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-fault-analysis-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20-bookworm-slim}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    environment:
      FRONTEND_LISTEN_PORT: 80
      API_UPSTREAM: http://api:5000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  ocr-models:
  uploads:
  runtime-logs:
  repo-cache:
  skill-workspace:
  codex-home:
