x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-registry.cn-hangzhou.aliyuncs.com/k8s-docker-image-yfq/python:3.10-slim}
    APT_MIRROR: ${APT_MIRROR:-https://mirrors.aliyun.com/debian}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}

services:
  api:
    image: ${BACKEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/k8s-docker-image-yfq/tools:logtoolsv1}
    build: *backend-build
    env_file:
      - .env
    environment:
      FLASK_APP: app.py
      PYTHONUNBUFFERED: "1"
    dns:
      - ${DOCKER_DNS:-223.5.5.5}
    command:
      - gunicorn
      - -w
      - ${WEB_CONCURRENCY:-4}
      - -k
      - ${GUNICORN_WORKER_CLASS:-gthread}
      - --threads
      - ${WEB_THREADS:-8}
      - --timeout
      - ${GUNICORN_TIMEOUT:-300}
      - --bind
      - 0.0.0.0:5000
      - app:create_app()
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./data/upload:/data/upload
      - ./data/logs:/app/app/logs
      - ./data/repos:/tmp/log-analyzer-repos
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:5000/dashboard/get', timeout=5).read()\nPY"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: ${BACKEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/k8s-docker-image-yfq/tools:logtoolsv1}
    build: *backend-build
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    dns:
      - ${DOCKER_DNS:-223.5.5.5}
    command:
      - celery
      - -A
      - celery_worker.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    volumes:
      - ./data/upload:/data/upload
      - ./data/logs:/app/app/logs
      - ./data/repos:/tmp/log-analyzer-repos
    restart: unless-stopped
    depends_on:
      - api

  migrate:
    image: ${BACKEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/k8s-docker-image-yfq/tools:logtoolsv1}
    build: *backend-build
    env_file:
      - .env
    environment:
      FLASK_APP: app.py
      PYTHONUNBUFFERED: "1"
    dns:
      - ${DOCKER_DNS:-223.5.5.5}
    command:
      - sh
      - -c
      - python init_database.py && (flask db upgrade || python bootstrap_schema.py)
    volumes:
      - ./data/upload:/data/upload
      - ./data/logs:/app/app/logs
      - ./data/repos:/tmp/log-analyzer-repos
    profiles:
      - tools

