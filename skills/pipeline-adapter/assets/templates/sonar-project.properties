# 注意：这是 Go 项目的 Sonar 基线模板
# Python/Web 项目请使用 assets/templates/python/ 或 assets/templates/web/ 下的专属模板

# TODO: 代码仓库分组/代码仓库名
sonar.projectKey={{MODULE_GROUP}}/{{MODULE_NAME}}
# TODO: 代码仓库名
sonar.projectName={{MODULE_NAME}}
sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/build.py,**/devops_api.py,**/test_build.py

sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**
sonar.go.coverage.reportPaths=./cov.out
