# docker-compose.yml
# 服务的编排文件，规范参考文档: https://docs.docker.com/compose/
# 由于项目采用docker-compose方式启动服务，环境变量传参方式更方便。
# 应用启动需要的配置参数已经统一收敛到 app.json 的 environments 中，
# 流水线编译时会自动填充到 docker-compose.yml，请勿在此处手写配置项。
# TODO: docker-compose根据模块业务场景不同，差异较大；新接入项目请勿直接copy，需根据实际需求修改，灵活应用

version: "3.4"

services:
  # TODO: 模块服务名（必须与 app.json 中的 spec.name、K8S 容器名保持一致）
  "{{REPO_GROUP}}-{{REPO_NAME}}":
    # TODO: 请根据实际名称修改镜像名称！镜像名称强制为：$REGISTRY_ADDR+代码库分组名+/代码库模块名:$代码库模块名大写_IMAGE_TAG;
    # 注意：$XXX_IMAGE_TAG 占位符严禁写成 ${XXX_IMAGE_TAG:-latest} 等带默认值的形式，必须保持纯 $XXX_IMAGE_TAG
    # 注意：模块名中的连字符必须保留（如 python-demo 应写为 $PYTHON-DEMO_IMAGE_TAG），严禁替换为下划线
    # "代码库分组名"为代码仓库的分组名；"代码库模块名"为代码仓库中模块名称
    image: "$REGISTRY_ADDR{{MODULE_GROUP}}/{{MODULE_NAME}}:{{MODULE_NAME_UPPER_HYPHEN_IMAGE_TAG}}"
    # TODO: 容器名称（必须与 app.json 中的 spec.name 保持一致）
    container_name: "{{REPO_GROUP}}-{{REPO_NAME}}"
    # TODO: 容器域名，用于服务发现
    hostname: "{{REPO_GROUP}}-{{REPO_NAME}}"
    restart: "unless-stopped"
    # shm_size: "4G"
    environment:
      # TODO: 所有环境变量已迁移到 app.json 的 environments 中声明
      # 流水线会自动填充，此处保留空标签即可
    # TODO: 服务运行时的资源限制，根据实际需求填写，此为必填！
    deploy:
      resources:
        # TODO: 资源限制已迁移到 app.json 的 resources 中声明，流水线会自动填充
    # TODO: 需要挂载到宿主机的目录卷
    volumes:
      - "${DATA_DIR:-/data/volume}/{{MODULE_GROUP}}/{{MODULE_NAME}}/logs:{{MODULE_NAME_UPPER_HYPHEN_WORKING_DIR}}/{{MODULE_NAME}}/logs"
    # 对外映射的端口，多个端口添加多个
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    networks:
      - default_bridge

networks:
  default_bridge:
    external: true
