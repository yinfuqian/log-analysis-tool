apiVersion: apps/v1
kind: Deployment  # 无状态类型为Deployment
metadata:
  name: {{REPO_GROUP}}-{{REPO_NAME}}-deployment # deployment的名字，格式为： 模块名字-deployment，不支持下划线，建议为仓库名字-deployment
  labels:
    # TODO 下面三个为deployment的标签，建议与下面spec.template.metadata.labels保持一致
    app.kubernetes.io/code-repo: {{REPO_GROUP}}_{{REPO_NAME}} # 模块代码仓库，如代码仓库为demo/go-demo，则这里写demo_go-demo
    # TODO 注意，这里app.kubernetes.io/name的label会作为服务部署的唯一标签，一定要有并且全局唯一
    app.kubernetes.io/name: {{REPO_GROUP}}_{{REPO_NAME}}  # app名字, 格式为： 代码仓库组_代码仓库，Eg:demo_go-demo
    app.kubernetes.io/component: application # 标记块在应用程序中可能扮演的角色,Eg:application, database
    app.kubernetes.io/part-of: {{MODULE_GROUP}} # 顶级应用名字，这里写产品名字，bot、call、learn等
spec:
  replicas: 1 # TODO pod副本数目
  selector:   # 选择器
    # 致命要求：matchLabels 必须与下面 template.metadata.labels 完全一致（键和值都要相同），否则pod无法被选中
    matchLabels:
      app.kubernetes.io/name: {{REPO_GROUP}}_{{REPO_NAME}}  # app名字, 格式为： 代码仓库组_代码仓库，Eg:demo_go-demo
      app.kubernetes.io/part-of: {{MODULE_GROUP}} # 顶级应用名字，这里写产品名字，bot、call、learn
  strategy: # 定义升级的策略
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/code-repo: {{REPO_GROUP}}_{{REPO_NAME}} # 模块代码仓库，如代码仓库为demo/go-demo，则这里写demo_go-demo
        app.kubernetes.io/name: {{REPO_GROUP}}_{{REPO_NAME}}  # app名字, 格式为： 代码仓库组_代码仓库，Eg:demo_go-demo
        app.kubernetes.io/component: application # 标记块在应用程序中可能扮演的角色,Eg:application, database
        app.kubernetes.io/part-of: {{MODULE_GROUP}} # 顶级应用名字，这里写产品名字，bot、call、learn
    spec:
      imagePullSecrets:
        - name: registry-secrets # 不要修改，且必须；Note： 流水线创建的环境中已经存在该secrete，手动创建的需要添加名字为registry-secrets的secrets
      containers:
        - image: {{ REGISTRY_ADDR | default('') }}{{MODULE_GROUP}}/{{REPO_NAME}}:{{MODULE_NAME_UPPER_HYPHEN_IMAGE_TAG}} # TODO image格式为： $REGISTRY_ADDR代码仓库所在组/代码仓库:$代码仓库名大写_IMAGE_TAG.
          imagePullPolicy: IfNotPresent
          name: {{REPO_GROUP}}-{{REPO_NAME}}   # TODO 容器的名字： 建议采用：代码仓库的组-代码仓库，不支持下划线
          env:
            # TODO: 环境变量已统一收敛到 app.json 中，流水线会自动填充 env 和 envFrom，此处保留空标签即可
          envFrom:
            # TODO: ConfigMap 引用已统一收敛到 app.json 中，流水线会自动填充，此处保留空标签即可
          resources:
            # TODO: 资源限制已统一收敛到 app.json 的 resources 中，流水线会自动填充，此处保留空标签即可
          readinessProbe: # TODO 就绪探针，必须（web 前端项目请将 httpGet 改为 tcpSocket，并删除 path 字段）
            httpGet:  # http请求（web 项目请改为 tcpSocket）
              path: /readyz # url（web 项目请删除本行；livenessProbe 可保留 httpGet，path 改为 /）
              port: {{ env['{{REPO_NAME}}-server-port'] | default({{SERVER_PORT}}) }}   # 容器端口，必须是int
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:  # TODO 存活探针，必须
            httpGet:
              path: /livez
              port: {{ env['{{REPO_NAME}}-server-port'] | default({{SERVER_PORT}}) }}
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
